[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maths-frenzy"
dynamic = ["version"]
description = "A fast-paced mental-maths game and calculator with desktop, web and terminal interfaces."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ABC Apps" }]
keywords = ["maths", "math", "game", "calculator", "education", "tkinter", "nicegui", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Environment :: X11 Applications",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Games/Entertainment :: Puzzle Games",
    "Typing :: Typed",
]
# The core, CLI and desktop interfaces need nothing beyond the standard library.
dependencies = []

[project.optional-dependencies]
web = ["nicegui>=2.0,<4"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
maths-frenzy = "maths_frenzy.launcher:main"
maths-frenzy-cli = "maths_frenzy.interfaces.cli:main"
maths-frenzy-desktop = "maths_frenzy.interfaces.desktop:main"
maths-frenzy-web = "maths_frenzy.interfaces.web:main"

[tool.setuptools.dynamic]
version = { attr = "maths_frenzy.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maths_frenzy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
# The maths symbols (x, /, -) are deliberate.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/maths_frenzy/core", "src/maths_frenzy/launcher.py"]
